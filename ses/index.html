<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SES · Sentio Ergo Sum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;800&family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--ink:#eef0f6;--mut:#9aa1b5;--gold:#ffd76a;--line:#22273a;--card:#0d1019;--serif:'Frank Ruhl Libre','Noto Serif','Noto Serif CJK SC','Noto Naskh Arabic',Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;line-height:1.6}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--mut);font-size:14px;flex-wrap:wrap}
.brand b{color:var(--gold);font-family:'Frank Ruhl Libre',serif;font-size:22px;letter-spacing:.06em}
.brand a{color:var(--mut)}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(30px,6vw,50px);line-height:1.15;margin:18px 0 6px}
.sub{color:var(--mut);margin:0 0 20px;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
textarea{width:100%;min-height:120px;background:#05060a;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:500 21px/1.5 var(--serif);resize:vertical;unicode-bidi:plaintext}
textarea:focus{outline:2px solid #ffd76a55}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select{background:#151a28;color:var(--ink);border:1px solid #2c3350;border-radius:10px;padding:8px 12px;font:600 14px Heebo,sans-serif;cursor:pointer}
button.pri{background:var(--gold);color:#111;border-color:var(--gold)}
.loc{color:var(--mut);font-size:14px}
#sky{width:100%;aspect-ratio:1;display:block;border-radius:50%;margin:10px auto;max-width:720px;touch-action:none}
.read{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.box{background:#05060a;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box .v{font:800 24px Heebo,sans-serif;font-variant-numeric:tabular-nums}
.box .k{color:var(--mut);font-size:13px}
.bits{font:600 15px/1.4 ui-monospace,Menlo,monospace;direction:ltr;text-align:left;letter-spacing:.12em;word-break:break-all;color:#cfd5e6}
.bits i{font-style:normal;color:var(--gold)}
h2{font-family:var(--serif);font-size:24px;margin:4px 0 8px}
.lens{font:500 21px/1.9 var(--serif);unicode-bidi:plaintext}
.lens .L{background:#000;color:#fff;outline:1px solid #555;border-radius:4px;padding:0 4px}
.lens .R{color:var(--gold);text-shadow:0 0 12px #ffd76a99}
.rem{display:flex;flex-direction:column;gap:8px}
.rem .it{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rem .w{background:#000;outline:1px solid #555;border-radius:6px;padding:2px 8px;font-family:var(--serif);font-size:19px}
.rem button{font-family:var(--serif);font-size:17px;font-weight:500}
.note{color:var(--mut);font-size:13px}
.stars{display:flex;flex-wrap:wrap;gap:8px}
.stars span{background:#05060a;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px}
.stars span b{color:var(--gold)}
input[type=range]{width:220px;accent-color:var(--gold)}
.pi{unicode-bidi:isolate;direction:ltr;display:inline-block}
@media(max-width:640px){.read{grid-template-columns:1fr 1fr}}
</style>
</head>

<div class="brand"><b>SES</b><span><span data-i="tag"></span> · <a href="#" id="lsw"></a></span></div>
<h1 data-i="h1"></h1>
<p class="sub" data-i="sub"></p>

<div class="card">
  <textarea id="t" dir="auto"></textarea>
  <div class="row" style="margin-top:10px">
    <button class="pri" id="geo" data-i="geo"></button>
    <select id="city"></select>
    <span class="loc" id="loc"></span>
  </div>
</div>

<canvas id="sky"></canvas>
<div class="row" style="justify-content:center;margin-bottom:6px">
  <span class="note" data-i="spin"></span>
  <input type="range" id="spd" min="0" max="3.6" step="0.01" value="2.78">
  <span class="note" id="spdL"></span>
</div>

<div class="read">
  <div class="box"><div class="v" id="nOn">—</div><div class="k" data-i="kOn"></div></div>
  <div class="box"><div class="v" id="nOff">—</div><div class="k" data-i="kOff"></div></div>
  <div class="box"><div class="v" id="nMid">—</div><div class="k" data-i="kMid"></div></div>
  <div class="box"><div class="v" id="sunV" style="font-size:18px">—</div><div class="k" id="sunK"></div></div>
</div>

<div class="card">
  <h2 data-i="leftT"></h2>
  <div class="bits" id="bits"></div>
  <p class="note" data-i="leftN"></p>
</div>

<div class="card">
  <h2 data-i="fastT"></h2>
  <div class="stars" id="fast"></div>
  <p class="note" data-i="fastN"></p>
</div>

<div class="card">
  <h2 data-i="lensT"></h2>
  <div class="lens" id="lens" dir="auto"></div>
  <p class="note" data-i="lensN"></p>
</div>

<div class="card">
  <h2><span data-i="remT"></span> <span class="pi">.14159…</span></h2>
  <div class="rem" id="rem"></div>
  <p class="note" data-i="remN"></p>
</div>

<p class="note" data-i="priv"></p>
<p class="note" style="text-align:center" data-i="copy"></p>
</main>

const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const NL='[^\\p{L}\\p{M}\\u0027\\u2019]';
for(const k in LEX){const L=LEX[k],keys=Object.keys(L.bin).sort((a,b)=>b.length-a.length);
 L.binRe=new RegExp('(^|'+NL+')('+(L.pre||'')+')('+keys.map(esc).join('|')+')(?=$|'+NL+')','giu');
 L.feelRe=new RegExp('(^|'+NL+')((?:'+(L.pre||'')+')(?:'+L.feel.map(esc).join('|')+'))(?=$|'+NL+')','giu')}
function pickLang(s){let best=null,bs=0;for(const k in LEX){const L=LEX[k];const n=(s.match(L.binRe)||[]).length*2+(s.match(L.feelRe)||[]).length;if(n>bs){bs=n;best=k}}
 if(!best){if(/[֐-׿]/.test(s))best='he';else if(/[؀-ۿ]/.test(s))best='ar';else if(/[Ѐ-ӿ]/.test(s))best='ru'}return best}
const html=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function lenses(){
 const s=t.value;const k=pickLang(s);const L=k&&LEX[k];let h=html(s);
 if(L){h=h.replace(L.binRe,(m,a,p,w)=>a+'<span class="L">'+p+w+'</span>');h=h.replace(L.feelRe,(m,a,w)=>a+'<span class="R">'+w+'</span>')}
 $('lens').innerHTML=h||'<span class="note">'+T.write+'</span>';
 const rem=$('rem');rem.innerHTML='';
 if(!L){rem.innerHTML='<span class="note">'+(s.trim()?T.noLex:T.write)+'</span>';return}
 const seen=new Set();let m;L.binRe.lastIndex=0;
 while((m=L.binRe.exec(s))){const p=m[2],w=m[3],full=p+w;if(seen.has(full.toLowerCase()))continue;seen.add(full.toLowerCase());
  const key=Object.keys(L.bin).find(x=>x.toLowerCase()===w.toLowerCase());if(!key)continue;
  const it=document.createElement('div');it.className='it';it.innerHTML='<span class="w" dir="auto">'+html(full)+'</span><span class="note">'+(LG==='he'?'←':'→')+'</span>';
  L.bin[key].forEach(alt=>{const b=document.createElement('button');b.dir='auto';b.textContent=p+alt;b.onclick=()=>{
    const re=new RegExp('(^|'+NL+')'+esc(full)+'(?=$|'+NL+')','u');t.value=t.value.replace(re,(x,a)=>a+p+alt);lenses();dirty=true};it.appendChild(b)});
  rem.appendChild(it)}
 if(!rem.children.length)rem.innerHTML='<span class="note">'+T.noBin+'</span>';
}
t.addEventListener('input',()=>{lenses();dirty=true});

// ---------- sky ----------
let W=0,R=0,C=0,dpr=1,MC=null,MD=null,dirty=true,lastCenter='';
function size(){dpr=Math.min(2,devicePixelRatio||1);const w=cv.clientWidth;W=Math.round(w*dpr);cv.width=cv.height=W;mask.width=mask.height=W;R=W*0.48;C=W/2;dirty=true}
addEventListener('resize',size);size();
const jd=ms=>ms/86400000+2440587.5;
function lstDeg(ms){const g=280.46061837+360.98564736629*(jd(ms)-2451545);return ((g+lon)%360+360)%360}
function sunRaDec(ms){const n=jd(ms)-2451545;const L=(280.460+0.9856474*n)*rad,g=(357.528+0.9856003*n)*rad;
 const lam=L+(1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad,eps=(23.439-0.0000004*n)*rad;
 return [Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam))/rad,Math.asin(Math.sin(eps)*Math.sin(lam))/rad]}
function altaz(ra,dec,lst){const ha=(lst-ra)*rad,d=dec*rad,l=lat*rad;
 const alt=Math.asin(Math.max(-1,Math.min(1,Math.sin(d)*Math.sin(l)+Math.cos(d)*Math.cos(l)*Math.cos(ha))));
 const az=Math.atan2(-Math.sin(ha)*Math.cos(d),Math.cos(l)*Math.sin(d)-Math.sin(l)*Math.cos(d)*Math.cos(ha));return [alt,az]}
function xy(alt,az){const r=R*Math.tan((Math.PI/2-alt)/2);return [C-r*Math.sin(az),C-r*Math.cos(az)]}
function proj(ra,dec,lst){const [a,z]=altaz(ra,dec,lst);const [x,y]=xy(a,z);return [x,y,a]}
const isRTL=s=>{const m=s.match(/[\p{L}]/u);return !!(m&&/[֐-ࣿיִ-﷿ﹰ-﻿]/.test(m[0]))};
function toks(s){if(window.Intl&&Intl.Segmenter){try{return [...new Intl.Segmenter(undefined,{granularity:'word'}).segment(s)].map(x=>x.segment)}catch(e){}}return s.split(/(\s+)/)}
function wrapLines(ctx,txt,maxW){const L=[];let cur='';for(const w of toks(txt)){const tr=cur+w;if(ctx.measureText(tr.trim()).width>maxW&&cur.trim()){L.push(cur.trim());cur=w.trimStart()}else cur=tr}if(cur.trim())L.push(cur.trim());return L}
const FONT='"Frank Ruhl Libre","Noto Serif","Noto Serif CJK SC","Noto Naskh Arabic",Georgia,serif';
function drawMask(cxp,cyp){
 mx.clearRect(0,0,W,W);let txt=t.value.trim();if(!txt)return null;
 if(txt.length>140)txt='…'+txt.slice(-140);
 let fs=W*0.16,L;
 for(;fs>W*0.03;fs*=0.92){mx.font='800 '+fs+'px '+FONT;L=wrapLines(mx,txt,R*1.25);if(L.length*fs*1.15<R*1.05)break}
 const rtl=isRTL(txt);mx.direction=rtl?'rtl':'ltr';mx.textAlign='center';mx.textBaseline='middle';mx.fillStyle='#000';
 const top=cyp-(L.length-1)*fs*1.15/2;L.forEach((ln,i)=>mx.fillText(ln,cxp,top+i*fs*1.15));
 return {L,fs,top,cx:cxp,rtl};
}
const mixc=(a,b,k)=>'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')+')';
function frame(now){
 const dt=now-last;last=now;const mult=Math.round(Math.pow(10,+$('spd').value));simT+=dt*mult;
 $('spdL').textContent=mult<=1?T.real:'×'+mult.toLocaleString(LG);
 const lst=lstDeg(simT);
 const [sra,sde]=sunRaDec(simT);const [sAlt,sAz]=altaz(sra,sde,lst);
 const aAlt=Math.max(-10*rad,-sAlt),aAz=sAz+Math.PI;           // anti-solar point
 const [ax,ay]=xy(aAlt,aAz);
 const key=Math.round(ax/(4*dpr))+','+Math.round(ay/(4*dpr));if(key!==lastCenter){lastCenter=key;dirty=true}
 if(dirty){MC=drawMask(ax,ay);MD=MC?mx.getImageData(0,0,W,W).data:null;dirty=false}
 const M=MC,md=MD;
 const day=Math.max(0,Math.min(1,(sAlt/rad+10)/12));           // 0 night .. 1 day
 cx.clearRect(0,0,W,W);cx.save();cx.beginPath();cx.arc(C,C,R,0,7);cx.clip();
 const g=cx.createRadialGradient(C,C,0,C,C,R);
 g.addColorStop(0,mixc([11,16,36],[58,110,180],day));g.addColorStop(.85,mixc([20,26,58],[110,160,215],day));g.addColorStop(1,mixc([40,32,70],[190,215,240],day));
 cx.fillStyle=g;cx.fillRect(0,0,W,W);
 // Earth's shadow + Belt of Venus, opposite the Sun, around twilight
 const tw=Math.max(0,1-Math.abs(sAlt/rad+2)/8);
 if(tw>0){const [hx,hy]=xy(0,aAz);const bg=cx.createRadialGradient(hx,hy,0,hx,hy,R*1.1);
  bg.addColorStop(0,'rgba(40,50,110,'+(.55*tw)+')');bg.addColorStop(.25,'rgba(236,150,175,'+(.55*tw)+')');bg.addColorStop(.6,'rgba(236,150,175,0)');cx.fillStyle=bg;cx.fillRect(0,0,W,W)}
 const starA=1-day*0.8;
 cx.strokeStyle='rgba(140,160,220,'+(.16*starA)+')';cx.lineWidth=1*dpr;
 for(const seg of LINES){cx.beginPath();let on=false;for(const [ra,de] of seg){const [x,y,a]=proj(ra,de,lst);if(a<0){on=false;continue}on?cx.lineTo(x,y):cx.moveTo(x,y);on=true}cx.stroke()}
 const px=(x,y)=>{x|=0;y|=0;if(x<0||y<0||x>=W||y>=W)return 0;return md[(y*W+x)*4+3]>127?1:0};
 const E=3*dpr;const shade=(x,y)=>{if(!md)return 0;let n=0;for(const [dx,dy] of [[0,0],[E,0],[-E,0],[0,E],[0,-E]])n+=px(x+dx,y+dy);return n/5};
 let on=0,off=0,mid=0;const vis=[];
 for(const s of STARS){const [x,y,a]=proj(s[0],s[1],lst);if(a<0)continue;const sh=shade(x,y);const st=sh>.82?0:sh<.18?1:.5;
  if(st===1)on++;else if(st===0)off++;else mid++;vis.push([s,x,y,st]);if(st===0)continue;
  const r=Math.max(.6,3.4-s[2]*.55)*dpr;cx.fillStyle=st===.5?'#ffd76a':'#fff';cx.globalAlpha=Math.min(1,1.15-s[2]*.15)*(st===.5?1:starA);
  cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}
 cx.globalAlpha=1;
 // the Sun
 if(sAlt>-0.02){const [sx,sy]=xy(sAlt,sAz);const sg=cx.createRadialGradient(sx,sy,0,sx,sy,R*.25);sg.addColorStop(0,'rgba(255,245,210,1)');sg.addColorStop(.08,'rgba(255,225,140,.9)');sg.addColorStop(1,'rgba(255,215,106,0)');cx.fillStyle=sg;cx.fillRect(0,0,W,W)}
 if(M){cx.save();cx.filter='blur('+(2*dpr)+'px)';cx.globalAlpha=.95;cx.drawImage(mask,0,0);cx.restore();
  cx.font='800 '+M.fs+'px '+FONT;cx.direction=M.rtl?'rtl':'ltr';cx.textAlign='center';cx.textBaseline='middle';
  cx.strokeStyle='rgba(255,215,106,.22)';cx.lineWidth=Math.max(1,M.fs*.008);cx.shadowColor='rgba(255,215,106,.5)';cx.shadowBlur=M.fs*.1;
  M.L.forEach((ln,i)=>cx.strokeText(ln,M.cx,M.top+i*M.fs*1.15));cx.shadowBlur=0}
 cx.font='600 '+(11*dpr)+'px Heebo,sans-serif';cx.textAlign='center';cx.direction=LG==='he'?'rtl':'ltr';
 for(const [s,x,y,st] of vis){const n=NAMES[s[3]];if(!n||s[2]>1.6)continue;cx.fillStyle=st===0?'rgba(150,150,170,.55)':'rgba(230,235,255,'+(.85*Math.max(.35,starA))+')';cx.fillText(LG==='he'?n[0]:n[1],x,y-8*dpr)}
 cx.restore();
 cx.strokeStyle='#2c3350';cx.lineWidth=2*dpr;cx.beginPath();cx.arc(C,C,R,0,7);cx.stroke();
 cx.fillStyle='#9aa1b5';cx.font='700 '+(13*dpr)+'px Heebo,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
 [[T.N,C,C-R-10*dpr],[T.S,C,C+R+10*dpr],[T.E,C-R+18*dpr,C],[T.W,C+R-18*dpr,C]].forEach(([n,x,y])=>cx.fillText(n,x,y));
 $('nOn').textContent=on;$('nOff').textContent=off;$('nMid').textContent=mid;
 const dirName=T.dirs[Math.round((((aAz/rad)%360+360)%360)/45)%8];
 $('sunV').textContent=T.shadowTo+' '+dirName;$('sunK').textContent=(sAlt>0?T.sunUp:T.sunDown)+' · '+T.sunAlt+' '+Math.round(sAlt/rad)+'°';
 const top32=vis.slice().sort((a,b)=>a[0][2]-b[0][2]).slice(0,32);
 $('bits').innerHTML=top32.map(v=>v[3]===.5?'<i>½</i>':v[3]).join('');
 const fast=vis.filter(v=>v[3]!==1&&NAMES[v[0][3]]&&NAMES[v[0][3]][2]).sort((a,b)=>NAMES[a[0][3]][2]-NAMES[b[0][3]][2]).slice(0,8);
 $('fast').innerHTML=fast.length?fast.map(v=>{const n=NAMES[v[0][3]];const k=Math.round(n[2]*2301*Math.cos(v[0][1]*rad)).toLocaleString(LG);
   return '<span>'+(LG==='he'?n[0]:n[1])+' · '+n[2]+' '+T.ly+' · <b>'+(LG==='he'?'פי '+k:k+'×')+'</b> '+T.fromLight+'</span>'}).join(''):'<span class="note" style="border:0">'+T.none+'</span>';
 requestAnimationFrame(frame)}
setLoc(lat,lon,LG==='he'?'ירושלים':'Jerusalem');lenses();
document.fonts&&document.fonts.ready.then(()=>{dirty=true});
const CDN='https://cdn.jsdelivr.net/npm/d3-celestial@0.7.35/data/';
Promise.all([fetch(CDN+'stars.6.json').then(r=>r.json()),fetch(CDN+'constellations.lines.json').then(r=>r.json())]).then(([a,b])=>{
 STARS=a.features.filter(f=>f.properties.mag<=5.2).map(f=>[f.geometry.coordinates[0],f.geometry.coordinates[1],f.properties.mag,f.id]);
 LINES=b.features.flatMap(f=>f.geometry.coordinates);requestAnimationFrame(frame)}).catch(()=>{$('loc').textContent=T.err});
}
